<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo | RP Guitar Store</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0b0b0b; background-image: radial-gradient(circle at 50% 30%, #161616 0%, #060606 70%); color: #ffffff; margin: 0; overflow-x: hidden; }
        body::before { content: ""; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.015'/%3E%3C/svg%3E"); pointer-events: none; z-index: 9999; }
        header { display: flex; justify-content: space-between; align-items: center; padding: 30px 60px; background-color: rgba(11, 11, 11, 0.85); backdrop-filter: blur(15px); position: sticky; top: 0; z-index: 1000; border-bottom: 1px solid rgba(255, 255, 255, 0.04); }
        .logo-area img { height: 90px; filter: brightness(0) invert(1); }
        .nav-container { display: flex; flex-direction: column; align-items: flex-end; gap: 12px; }
        .social-icons { display: flex; gap: 20px; }
        .social-icons a { color: rgba(255, 255, 255, 0.5); font-size: 14px; transition: color 0.3s; }
        .social-icons a:hover { color: #c5a880; }
        nav { display: flex; gap: 35px; align-items: center; text-transform: uppercase; font-size: 12px; letter-spacing: 2px; }
        nav a { color: rgba(255, 255, 255, 0.7); text-decoration: none; transition: color 0.3s; }
        nav a:hover, nav a.active { color: #c5a880; }
        
        /* Botón de Hamburguesa (Oculto en Escritorio) */
        .menu-toggle {
            display: none;
            background: none;
            border: none;
            color: #ffffff;
            font-size: 24px;
            cursor: pointer;
            z-index: 1100;
        }

        .dropdown { position: relative; }
        .dropdown-content { opacity: 0; visibility: hidden; transform: translateX(-50%) translateY(15px); position: absolute; background-color: rgba(15, 15, 15, 0.98); backdrop-filter: blur(10px); min-width: 240px; max-height: 400px; overflow-y: auto; box-shadow: 0px 30px 60px rgba(0,0,0,0.6); border: 1px solid rgba(255, 255, 255, 0.06); z-index: 110; top: 100%; left: 50%; padding: 15px 0; transition: all 0.3s ease; }
        .dropdown:hover .dropdown-content { opacity: 1; visibility: visible; transform: translateX(-50%) translateY(0); }
        .dropdown-content a { color: rgba(255, 255, 255, 0.55); padding: 11px 25px; display: block; font-size: 11px; text-transform: uppercase; transition: all 0.2s; }
        .dropdown-content a:hover { background-color: rgba(197, 168, 128, 0.06); color: #c5a880; }
        .content-area { max-width: 1200px; margin: 80px auto; padding: 0 40px; position: relative; z-index: 10; text-align: center; }
        
        #search-bar { width: 400px; padding: 12px 20px; margin: 20px auto; display: block; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 25px; color: white; text-align: center; }
        .filter-buttons { margin: 20px 0; display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; }
        .filter-btn { padding: 8px 16px; background: transparent; border: 1px solid #c5a880; color: #c5a880; cursor: pointer; text-transform: uppercase; font-size: 10px; }
        .filter-btn.active { background: #c5a880; color: #000; }

        #product-grid { 
            display: grid; 
            grid-template-columns: repeat(4, 1fr); 
            gap: 20px; 
            width: 100%; 
            max-width: 1200px; 
            margin: 0 auto; 
        }

        .product-card { 
            background: rgba(255,255,255,0.02); 
            padding: 25px; 
            border: 1px solid rgba(255,255,255,0.03); 
            border-radius: 8px; 
            text-align: center; 
            width: 100%; 
            box-sizing: border-box; 
        }
        
        .product-card img { width: 100%; aspect-ratio: 4/5; object-fit: contain; margin-bottom: 20px; }
        .price { color: #c5a880; font-weight: 600; display: block; margin-top: 15px; }
        footer { background-color: #060606; color: rgba(255, 255, 255, 0.35); padding: 90px 20px; text-align: center; border-top: 1px solid rgba(255, 255, 255, 0.02); position: relative; z-index: 10; margin-top: 100px; }
        .footer-logo { max-width: 150px; margin: 0 auto 40px auto; display: block; filter: brightness(0) invert(1); opacity: 0.65; }

        @media (max-width: 1024px) {
            #product-grid { grid-template-columns: repeat(3, 1fr); }
        }
     @media (max-width: 768px) {
    header {
        padding: 20px !important;
    }
    .menu-toggle {
        display: block !important;
    }
    .nav-container {
        position: absolute !important;
        top: 100% !important;
        left: 0 !important;
        width: 100% !important;
        background-color: rgba(11, 11, 11, 0.98) !important;
        backdrop-filter: blur(15px) !important;
        flex-direction: column !important;
        align-items: center !important;
        padding: 25px 0 !important;
        gap: 20px !important;
        border-bottom: 1px solid rgba(255, 255, 255, 0.06) !important;
        box-shadow: 0 20px 40px rgba(0,0,0,0.8) !important;
        display: none !important;
    }
    .nav-container.active {
        display: flex !important;
    }
    nav {
        flex-direction: column !important;
        align-items: center !important;
        gap: 15px !important;
    }
    .dropdown-content {
        position: static !important;
        transform: none !important;
        opacity: 1 !important;
        visibility: visible !important;
        display: none !important;
        background-color: #121212 !important;
        border: 1px solid rgba(197, 168, 128, 0.2) !important;
        border-radius: 6px !important;
        box-shadow: 0 10px 20px rgba(0,0,0,0.5) !important;
        max-height: 220px !important;
        overflow-y: auto !important;
        margin: 12px 0 !important;
        width: 100% !important;
        box-sizing: border-box !important;
    }
    .dropdown.active .dropdown-content {
        display: block !important;
    }
    
    /* Título principal adaptado y reducido para móviles */
    #cat-title {
        font-size: 28px !important;
        margin-bottom: 20px !important;
        padding: 0 15px !important;
        word-break: break-word !important;
    }

    #search-bar {
        width: 90% !important;
    }

    #product-grid {
        display: grid !important;
        grid-template-columns: repeat(2, 1fr) !important;
        gap: 10px !important;
        align-items: stretch !important;
    }

    .product-card {
        display: flex !important;
        flex-direction: column !important;
        height: 100% !important;
        padding: 10px !important;
    }

    .product-card p {
        flex-grow: 1 !important;
        margin-bottom: 10px !important;
        text-align: justify !important;
    }

    .price {
        margin-top: auto !important;
        font-size: 13px !important;
        font-weight: 700 !important;
        display: block !important;
    } 

    .product-card h3 {
        font-size: 14px !important;
    }
}
@media (max-width: 480px) {
    #product-grid { grid-template-columns: 1fr; }
    .content-area { padding: 0 20px; margin: 40px auto; }
}
    </style>
</head>
<body>

<header>
    <div class="logo-area">
        <a href="/">
            <img src="rplogo.png" alt="RP Guitar Store">
        </a>
    </div>

    <button class="menu-toggle" onclick="toggleMenu()" aria-label="Abrir Menú">
        <i class="fas fa-bars"></i>
    </button>
    
   <div class="nav-container" id="nav-container">
    <div class="social-icons">
        <a href="https://www.facebook.com/RpGuitarStore" target="_blank" rel="noopener noreferrer"><i class="fab fa-facebook-f"></i></a>
        <a href="https://www.instagram.com/rpguitarstore" target="_blank" rel="noopener noreferrer"><i class="fab fa-instagram"></i></a>
        <a href="https://www.youtube.com/@RicharPerezGuitar" target="_blank" rel="noopener noreferrer"><i class="fab fa-youtube"></i></a>
        <a href="https://www.tiktok.com/@rpguitarstore1" target="_blank" rel="noopener noreferrer"><i class="fab fa-tiktok"></i></a>
    </div>

        <nav>
            <a href="index.html">Inicio</a>
            <div class="dropdown" onclick="toggleDropdown(this)">
                <a href="#" class="dropdown-trigger">Guitarras <i class="fas fa-chevron-down" style="margin-left: 5px;"></i></a>
                <div class="dropdown-content">
                    <a href="categoria.html?cat=Guitarras-Eléctricas">Eléctricas</a>
                    <a href="categoria.html?cat=Guitarras-Acústicas">Acústicas</a>
                    <a href="categoria.html?cat=Electro-Acústicas">Electro Acústicas</a>
                    <a href="categoria.html?cat=Ukeleles">Ukeleles</a>
                </div>
            </div>
            <a href="categoria.html?cat=Amplificadores">Amplificadores</a>
            <div class="dropdown" onclick="toggleDropdown(this)">
                <a href="#" class="dropdown-trigger">Pedales <i class="fas fa-chevron-down" style="margin-left: 5px;"></i></a>
                <div id="menu-pedales" class="dropdown-content"></div>
            </div>
            <div class="dropdown" onclick="toggleDropdown(this)">
                <a href="#" class="dropdown-trigger">Accesorios <i class="fas fa-chevron-down" style="margin-left: 5px;"></i></a>
                <div id="menu-accesorios" class="dropdown-content"></div>
            </div>
            <a href="categoria.html?cat=Lauten-Audio">Micrófonos</a>
        </nav>
    </div>
</header>

<main class="content-area">
    <h1 id="cat-title" style="font-family: 'Cormorant Garamond', serif; font-size: 48px; margin-bottom: 40px;">Cargando...</h1>
    
    <input type="text" id="search-bar" placeholder="Buscar por nombre..." onkeyup="filterProducts()">
    <div class="filter-buttons" id="filter-buttons"></div>
    
    <div id="product-grid"></div>
</main>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
    import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js";

    const firebaseConfig = { apiKey: "AIzaSyC7W3ekV5oP1rX6kdJoZQJGry3w2XlhDHA", authDomain: "rpguitarstore-fa879.firebaseapp.com", projectId: "rpguitarstore-fa879", storageBucket: "rpguitarstore-fa879.firebasestorage.app", messagingSenderId: "580505435322", appId: "1:580505435322:web:122d4c01344606c1fe5683" };
    const db = getFirestore(initializeApp(firebaseConfig));
    let allProducts = [];

    async function iniciarPagina() {
        const snapshot = await getDocs(collection(db, "productos"));
        const params = new URLSearchParams(window.location.search);
        const cat = params.get('cat'); 

        const pedalesDiv = document.getElementById('menu-pedales');
        const accsDiv = document.getElementById('menu-accesorios');
        const listaPedales = new Set();
        const listaAccesorios = new Set();

        snapshot.forEach(doc => {
            const p = doc.data();
            if (p.grupo === 'Pedales' && p.categoria) listaPedales.add(p.categoria);
            if (p.grupo === 'Accesorios' && p.categoria) listaAccesorios.add(p.categoria);
        });

        listaPedales.forEach(c => pedalesDiv.innerHTML += `<a href="categoria.html?cat=${c}">${c.replace(/-/g, ' ').toUpperCase()}</a>`);
        listaAccesorios.forEach(c => accsDiv.innerHTML += `<a href="categoria.html?cat=${c}">${c.replace(/-/g, ' ').toUpperCase()}</a>`);

       if (cat) {
            let titulo = (cat === 'Lauten-Audio') ? 'Micrófonos' : cat;
            document.getElementById('cat-title').innerText = titulo.replace(/-/g, ' ').toUpperCase();
            const nombreCat = cat.toLowerCase().replace(/-/g, ' ').trim();

            allProducts = snapshot.docs
                .map(doc => doc.data())
                .filter(p => {
                    const grupo = p.grupo ? p.grupo.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/-/g, ' ').trim() : "";
                    const categoria = p.categoria ? p.categoria.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/-/g, ' ').trim() : "";
                    
                    if (grupo.includes("pedal") || grupo.includes("accesorio")) return false;

                    if (nombreCat.includes("electro")) {
                        return grupo.includes("electro") && !grupo.includes("guitarras electricas");
                    }
                    if (nombreCat.includes("electricas")) {
                        return (grupo.includes("electrica") || grupo.includes("electricas")) && !grupo.includes("electro");
                    }
                    if (nombreCat.includes("acusticas") && !nombreCat.includes("electro")) {
                        return grupo.includes("acustica") && !grupo.includes("electro");
                    }

                    return grupo.includes(nombreCat) || categoria.includes(nombreCat);
                })
                .sort((a, b) => {
                    const stockA = parseInt(String(a.stock).replace(/[^0-9]/g, '')) || 0;
                    const stockB = parseInt(String(b.stock).replace(/[^0-9]/g, '')) || 0;
                    
                    if (stockA > 0 && stockB === 0) return -1;
                    if (stockA === 0 && stockB > 0) return 1;
                    
                    const priceA = parseFloat(String(a.price).replace(/,/g, '').trim()) || 0;
                    const priceB = parseFloat(String(b.price).replace(/,/g, '').trim()) || 0;
                    
                    return priceA - priceB;
                });
            
            renderButtons(allProducts);
            renderizarProductos(allProducts);
        }
    }

   function renderButtons(products) {
        const container = document.getElementById('filter-buttons');
        const marcas = [...new Set(products.map(p => p.categoria || 'General'))].sort();
        
        container.innerHTML = `<button class="filter-btn active" onclick="filterByBrand('all', this)">TODOS</button>`;
        marcas.forEach(m => {
            container.innerHTML += `<button class="filter-btn" onclick="filterByBrand('${m}', this)">${m.replace(/-/g, ' ').toUpperCase()}</button>`;
        });
    }

    window.filterByBrand = (brand, el) => {
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        el.classList.add('active');
        
        const isAll = !brand || brand === 'all' || brand.toLowerCase() === 'all';
        let filtered = isAll ? [...allProducts] : allProducts.filter(p => (p.categoria || 'General') === brand);
        
        filtered.sort((a, b) => {
            const stockA = parseInt(a.stock) || 0;
            const stockB = parseInt(b.stock) || 0;
            
            if (stockA === 0 && stockB > 0) return 1;
            if (stockA > 0 && stockB === 0) return -1;
            
            const priceA = parseFloat(String(a.price).replace(/,/g, '').trim()) || 0;
            const priceB = parseFloat(String(b.price).replace(/,/g, '').trim()) || 0;
            
            return priceA - priceB;
        });

        renderizarProductos(filtered);
    };

    window.filterProducts = () => {
        const val = document.getElementById('search-bar').value.toLowerCase();
        const filtered = allProducts.filter(p => p.name.toLowerCase().includes(val));
        renderizarProductos(filtered);
    };

    function renderizarProductos(productos) {
        const grid = document.getElementById('product-grid');
        grid.innerHTML = productos.length > 0 ? productos.map(data => `
            <div class="product-card">
                <img src="${data.image}">
                <h3>${data.name}</h3>
                <p style="color: rgba(255,255,255,0.5); font-size: 13px; line-height: 1.6; text-align: justify; margin: 10px 0;">
                    ${data.desc || ''}
                </p>
                ${(parseInt(data.stock) || 0) === 0 ? '<span style="color:red; font-weight:700;">AGOTADO</span>' : '<span class="price">Q'+data.price+'</span>'}
            </div>`).join('') : "<p>No hay productos en esta categoría.</p>";
    }

    iniciarPagina();
</script>

<script>
    function toggleMenu() {
        const navContainer = document.getElementById('nav-container');
        navContainer.classList.toggle('active');
    }

    function toggleDropdown(element) {
        if (window.innerWidth <= 768) {
            // Buscamos todos los menús desplegables dentro de la navegación móvil
            const allDropdowns = document.querySelectorAll('.dropdown');
            
            // Recorremos cada uno y cerramos los demás que no sean el que acabamos de presionar
            allDropdowns.forEach(item => {
                if (item !== element) {
                    item.classList.remove('active');
                }
            });

            // Alternamos el estado del elemento actual (si estaba abierto se cierra, si estaba cerrado se abre)
            element.classList.toggle('active');
        }
    }
</script>

<footer>
    <img class="footer-logo" src="rplogo.png" alt="RP Guitar Store Logo">
    <p>&copy; 2022 by RP Guitar Store. Proudly created by Antony de León</p>
</footer>
</body>
</html>
