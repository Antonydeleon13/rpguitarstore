        .dropdown:hover .dropdown-content { opacity: 1; visibility: visible; transform: translateX(-50%) translateY(0); }
        .dropdown-content a { color: rgba(255, 255, 255, 0.55); padding: 11px 25px; display: block; font-size: 11px; text-transform: uppercase; transition: all 0.2s; }

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
    import { getFirestore, collection, addDoc, getDocs } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js";

    const firebaseConfig = { apiKey: "AIzaSyC7W3ekV5oP1rX6kdJoZQJGry3w2XlhDHA", authDomain: "rpguitarstore-fa879.firebaseapp.com", projectId: "rpguitarstore-fa879", storageBucket: "rpguitarstore-fa879.firebasestorage.app", messagingSenderId: "580505435322", appId: "1:580505435322:web:122d4c01344606c1fe5683" };
    const db = getFirestore(initializeApp(firebaseConfig));
    let allProducts = [];

    let cart = JSON.parse(localStorage.getItem('rp_cart')) || [];

    function saveCart() {
        localStorage.setItem('rp_cart', JSON.stringify(cart));
        renderCart();
    }

    window.addToCart = (id) => {
        const product = allProducts.find(p => p.id === id);
        if (!product) return;

        const existingItem = cart.find(item => item.id === id);
        if (existingItem) {
            existingItem.qty += 1;
        } else {
            cart.push({
                id: product.id,
                name: product.name,
                price: parseFloat(String(product.price).replace(/,/g, '').trim()) || 0,
                image: product.image,
                qty: 1
            });
        }
        saveCart();
        toggleCartModal(true);
    };

    window.updateQty = (id, change) => {
        const item = cart.find(item => item.id === id);
        if (item) {
            item.qty += change;
            if (item.qty <= 0) {
                cart = cart.filter(i => i.id !== id);
            }
            saveCart();
        }
    };

    window.removeFromCart = (id) => {
        cart = cart.filter(item => item.id !== id);
        saveCart();
    };

    function renderCart() {
        const container = document.getElementById('cart-items-container');
        const badge = document.getElementById('cart-badge');
        const totalPriceEl = document.getElementById('cart-total-price');

        const totalQty = cart.reduce((acc, item) => acc + item.qty, 0);
        badge.innerText = totalQty;

        if (cart.length === 0) {
            container.innerHTML = `<div class="cart-empty-msg">Tu carrito está vacío.</div>`;
            totalPriceEl.innerText = "Q0.00";
            return;
        }

        let total = 0;
        container.innerHTML = cart.map(item => {
            const itemTotal = item.price * item.qty;
            total += itemTotal;
            return `
                <div class="cart-item">
                    <img src="${item.image}" alt="${item.name}">
                    <div class="cart-item-details">
                        <p class="cart-item-title">${item.name}</p>
                        <span class="cart-item-price">Q${item.price.toLocaleString('en-US', {minimumFractionDigits: 2})}</span>
                        <div class="cart-item-qty">
                            <button class="qty-btn" onclick="updateQty('${item.id}', -1)">-</button>
                            <span>${item.qty}</span>
                            <button class="qty-btn" onclick="updateQty('${item.id}', 1)">+</button>
                        </div>
                    </div>
                    <i class="fas fa-trash cart-item-remove" onclick="removeFromCart('${item.id}')"></i>
                </div>
            `;
        }).join('');

        totalPriceEl.innerText = `Q${total.toLocaleString('en-US', {minimumFractionDigits: 2})}`;
    }

    window.toggleCartModal = (forceOpen = false) => {
        const sidebar = document.getElementById('cart-sidebar');
        const overlay = document.getElementById('cart-overlay');
        
        if (forceOpen) {
            sidebar.classList.add('active');
            overlay.classList.add('active');
        } else {
            sidebar.classList.toggle('active');
            overlay.classList.toggle('active');
        }
    };

    // GUARDAR PEDIDO EN FIREBASE Y MANDAR LINK DE ADMIN A WHATSAPP
    window.checkoutWhatsApp = async () => {
    if (cart.length === 0) {
        alert("Tu carrito está vacío.");
        return;
    }

    const inputNombre = document.getElementById('cliente-nombre');
    const nombre = inputNombre ? inputNombre.value.trim() : '';

    if (!nombre) {
        alert("Por favor ingresa tu nombre para completar el pedido.");
        return;
    }

    let total = 0;
    const itemsPedido = cart.map(item => {
        const subtotal = item.price * item.qty;
        total += subtotal;
        return {
            id: item.id,
            name: item.name,
            price: item.price,
            qty: item.qty,
            image: item.image,
            subtotal: subtotal
        };
    });

    try {
        const docRef = await addDoc(collection(db, "pedidos"), {
            cliente: { nombre },
            items: itemsPedido,
            total: total,
            fecha: new Date().toLocaleString("es-GT"),
            timestamp: Date.now()
        });

        const codigoPedido = docRef.id.substring(0, 6).toUpperCase();

        let mensaje = `¡Hola RP Guitar Store! Mi nombre es *${nombre}*.\nQuisiera realizar el siguiente pedido:\n\n`;
        cart.forEach((item, index) => {
            const subtotal = item.price * item.qty;
            mensaje += `*${index + 1}. ${item.name}*\n   Cantidad: ${item.qty} | Subtotal: Q${subtotal.toLocaleString('en-US', {minimumFractionDigits: 2})}\n`;
        });

        mensaje += `\n*TOTAL DEL PEDIDO:* Q${total.toLocaleString('en-US', {minimumFractionDigits: 2})}\n`;
        mensaje += `*Código de Pedido:* #${codigoPedido}\n\n¿Me podrías brindar los datos de pago?`;

        const phone = "50256167009";
        const url = `https://api.whatsapp.com/send?phone=${phone}&text=${encodeURIComponent(mensaje)}`;
        
        cart = [];
        saveCart();
        toggleCartModal(false);

        // En móviles usamos window.location.href para forzar la apertura de la App de WhatsApp
        window.location.href = url;

    } catch (error) {
        console.error("Error al registrar pedido:", error);
        alert("Ocurrió un error al procesar el pedido.");
    }
};

  async function iniciarPagina() {
    const snapshot = await getDocs(collection(db, "productos"));
    const params = new URLSearchParams(window.location.search);
    const cat = params.get('cat'); 

    const pedalesDiv = document.getElementById('menu-pedales');
    const accsDiv = document.getElementById('menu-accesorios');
    const listaPedales = new Set();
    const listaAccesorios = new Set();

    snapshot.forEach(doc => {
        const p = doc.data();
        p.id = doc.id;
        if (p.grupo === 'Pedales' && p.categoria) listaPedales.add(p.categoria);
        if (p.grupo === 'Accesorios' && p.categoria) listaAccesorios.add(p.categoria);
    });

    listaPedales.forEach(c => pedalesDiv.innerHTML += `<a href="categoria.html?cat=${c}&grupo=Pedales">${c.replace(/-/g, ' ').toUpperCase()}</a>`);
    listaAccesorios.forEach(c => accsDiv.innerHTML += `<a href="categoria.html?cat=${c}&grupo=Accesorios">${c.replace(/-/g, ' ').toUpperCase()}</a>`);

    if (cat) {
        let titulo = (cat === 'Lauten-Audio') ? 'Micrófonos' : cat;
        document.getElementById('cat-title').innerText = titulo.replace(/-/g, ' ').toUpperCase();
        const nombreCat = cat.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/-/g, ' ').trim();

        allProducts = snapshot.docs
            .map(doc => ({ id: doc.id, ...doc.data() }))
            .filter(p => {
                const grupo = p.grupo ? p.grupo.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/-/g, ' ').trim() : "";
                const categoria = p.categoria ? p.categoria.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/-/g, ' ').trim() : "";
                
                // Leemos si la URL trae un parámetro de grupo específico
                const grupoUrl = params.get('grupo') ? params.get('grupo').toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/-/g, ' ').trim() : "";

                if (nombreCat === "electro acusticas" || nombreCat === "electro-acusticas" || nombreCat.includes("electro-acustica") || nombreCat.includes("electro acustica")) {
                    return grupo.includes("electro") && !grupo.includes("guitarras electricas");
                }
                if (nombreCat.includes("electricas")) {
                    return (grupo.includes("electrica") || grupo.includes("electricas")) && !grupo.includes("electro");
                }
                if (nombreCat.includes("acusticas") && !nombreCat.includes("electro")) {
                    return grupo.includes("acustica") && !grupo.includes("electro");
                }
                if (nombreCat.includes("bajo") || nombreCat.includes("bajos")) {
                    return grupo.includes("bajo") || categoria.includes("bajo");
                }
                if (nombreCat.includes("amplificador")) {
                    return grupo.includes("amplificador") || categoria.includes("amplificador");
                }
                if (nombreCat.includes("pedal") && !grupoUrl) {
                    return grupo.includes("pedal") || categoria.includes("pedal") || grupo.includes("pedales");
                }
                if (nombreCat.includes("accesorio")) {
                    return grupo.includes("accesorio") || categoria.includes("accesorio") || grupo.includes("accesorios");
                }

                // Si en la URL viene especificado el grupo, exige coincidencia
                if (grupoUrl) {
                    return (categoria.includes(nombreCat) || grupo.includes(nombreCat)) && grupo.includes(grupoUrl);
                }

                return grupo.includes(nombreCat) || categoria.includes(nombreCat) || grupo === nombreCat || categoria === nombreCat;
            })
            .sort((a, b) => {
                const stockA = parseInt(String(a.stock).replace(/[^0-9]/g, '')) || 0;
                const stockB = parseInt(String(b.stock).replace(/[^0-9]/g, '')) || 0;
                
                if (stockA > 0 && stockB === 0) return -1;
                if (stockA === 0 && stockB > 0) return 1;
                
                const priceA = parseFloat(String(a.price).replace(/,/g, '').trim()) || 0;
                const priceB = parseFloat(String(b.price).replace(/,/g, '').trim()) || 0;
                
                return priceA - priceB;
            });

        renderButtons(allProducts);
        renderizarProductos(allProducts);
    }
    renderCart();
}

function renderButtons(products) {
    const container = document.getElementById('filter-buttons');
    const marcas = [...new Set(products.map(p => p.categoria || 'General'))].sort();
    
    container.innerHTML = `<button class="filter-btn active" onclick="filterByBrand('all', this)">TODOS</button>`;
    marcas.forEach(m => {
        container.innerHTML += `<button class="filter-btn" onclick="filterByBrand('${m}', this)">${m.replace(/-/g, ' ').toUpperCase()}</button>`;
    });
}

window.filterByBrand = (brand, el) => {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    el.classList.add('active');
    
    const isAll = !brand || brand === 'all' || brand.toLowerCase() === 'all';
    let filtered = isAll ? [...allProducts] : allProducts.filter(p => (p.categoria || 'General') === brand);
    
    filtered.sort((a, b) => {
        const stockA = parseInt(a.stock) || 0;
        const stockB = parseInt(b.stock) || 0;
        
        if (stockA === 0 && stockB > 0) return 1;
        if (stockA > 0 && stockB === 0) return -1;
        
        const priceA = parseFloat(String(a.price).replace(/,/g, '').trim()) || 0;
        const priceB = parseFloat(String(b.price).replace(/,/g, '').trim()) || 0;
        
        return priceA - priceB;
    });

    renderizarProductos(filtered);
};

window.filterProducts = () => {
    const val = document.getElementById('search-bar').value.toLowerCase();
    const filtered = allProducts.filter(p => p.name.toLowerCase().includes(val));
    renderizarProductos(filtered);
};

function renderizarProductos(productos) {
    const grid = document.getElementById('product-grid');
    grid.innerHTML = productos.length > 0 ? productos.map(data => {
        const isAgotado = (parseInt(data.stock) || 0) === 0;

        // Manejo de fotos: si existe data.images usa ese arreglo, si no, usa la foto única data.image
        const fotos = (data.images && data.images.length > 0) ? data.images : [data.image];
        const tieneVariasFotos = fotos.length > 1;

        return `
        <div class="product-card" data-id="${data.id}">
            <div class="product-card-img-wrapper" id="wrapper-${data.id}" data-index="0" data-images='${JSON.stringify(fotos).replace(/'/g, "&apos;")}'>
                ${tieneVariasFotos ? `<button class="card-nav-btn prev" onclick="prevNextImage('${data.id}', -1, event)"><i class="fas fa-chevron-left"></i></button>` : ''}
                <img id="img-${data.id}" src="${fotos[0]}">
                ${tieneVariasFotos ? `<button class="card-nav-btn next" onclick="prevNextImage('${data.id}', 1, event)"><i class="fas fa-chevron-right"></i></button>` : ''}
                ${tieneVariasFotos ? `
                    <div class="card-dots" id="dots-${data.id}">
                        ${fotos.map((_, i) => `<span class="card-dot ${i === 0 ? 'active' : ''}"></span>`).join('')}
                    </div>
                ` : ''}
            </div>

            <h3>${data.name}</h3>
            <p style="color: rgba(255,255,255,0.5); font-size: 13px; line-height: 1.6; text-align: justify; margin: 10px 0;">
                ${data.desc || ''}
            </p>
            ${isAgotado ? '<span style="color:red; font-weight:700;">AGOTADO</span>' : '<span class="price">Q'+data.price+'</span>'}
            <button class="btn-add-cart" ${isAgotado ? 'disabled style="opacity:0.5; cursor:not-allowed;"' : `onclick="addToCart('${data.id}')"`}>
                ${isAgotado ? 'Sin stock' : 'Agregar al Carrito'}
            </button>
        </div>`;
    }).join('') : "<p>Artículos no disponibles aún.</p>";

    // RESALTAR Y HACER SCROLL ÚNICAMENTE AL PRODUCTO ESPECÍFICO
    const params = new URLSearchParams(window.location.search);
    const selectId = params.get('selectId');
    const selectedName = params.get('select');

    let tarjetaEncontrada = null;

    // 1. Prioridad Máxima: Buscar por ID directo si existe y no es "undefined"
    if (selectId && selectId !== 'undefined') {
        tarjetaEncontrada = grid.querySelector(`.product-card[data-id="${selectId}"]`);
    }

    // 2. Si no hay ID válido, buscar por nombre exacto
    if (!tarjetaEncontrada && selectedName) {
        const targetClean = decodeURIComponent(selectedName).trim().toLowerCase().replace(/-/g, ' ');
        const cards = grid.querySelectorAll('.product-card');

        for (const card of cards) {
            const titleEl = card.querySelector('h3');
            const titleClean = titleEl ? titleEl.innerText.trim().toLowerCase().replace(/-/g, ' ') : '';
            if (titleClean === targetClean) {
                tarjetaEncontrada = card;
                break;
            }
        }
    }

    // 3. Aplicar estilo y scroll
    if (tarjetaEncontrada) {
        tarjetaEncontrada.classList.add('highlight-selected');
        setTimeout(() => {
            tarjetaEncontrada.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }, 300);
    }
}

// FUNCIÓN PARA CAMBIAR DE IMAGEN EN LA MISMA CARD
window.prevNextImage = (id, direction, event) => {
    event.stopPropagation();
    const wrapper = document.getElementById(`wrapper-${id}`);
    const img = document.getElementById(`img-${id}`);
    const dotsContainer = document.getElementById(`dots-${id}`);
    
    if (!wrapper || !img) return;

    const images = JSON.parse(wrapper.getAttribute('data-images'));
    let currentIndex = parseInt(wrapper.getAttribute('data-index')) || 0;

    currentIndex += direction;
    if (currentIndex < 0) currentIndex = images.length - 1;
    if (currentIndex >= images.length) currentIndex = 0;

    wrapper.setAttribute('data-index', currentIndex);
    img.src = images[currentIndex];

    if (dotsContainer) {
        const dots = dotsContainer.querySelectorAll('.card-dot');
        dots.forEach((dot, idx) => {
            dot.classList.toggle('active', idx === currentIndex);
        });
    }
};

iniciarPagina();
</script>

        if (window.innerWidth <= 768) {
            const allDropdowns = document.querySelectorAll('.dropdown');
            allDropdowns.forEach(item => {
                if (item !== element) {
                    item.classList.remove('active');
                }
            });
            element.classList.toggle('active');
        }
    }
</script>
