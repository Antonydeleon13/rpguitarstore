<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Admin Maestro | RP Guitar Store</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background: #0b0b0b; color: white; margin: 0; padding: 20px; overflow-x: hidden; }
        body::before { content: ""; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.015'/%3E%3C/svg%3E"); pointer-events: none; z-index: 9999; }
        .admin-container { max-width: 850px; margin: 0 auto; background: #161616; padding: 30px; border-radius: 8px; position: relative; z-index: 10; }
        .logo-admin { width: 150px; display: block; margin: 0 auto 20px auto; filter: brightness(0) invert(1); }
        .tabs { display: flex; gap: 10px; margin-bottom: 20px; }
        .tab-btn { padding: 10px 20px; background: #222; border: none; color: white; cursor: pointer; border-radius: 4px; }
        .tab-btn.active { background: #c5a880; color: #000; font-weight: bold; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        input, textarea, select { width: 100%; padding: 12px; margin: 10px 0; background: #222; border: 1px solid #333; color: white; box-sizing: border-box; }
        button { padding: 15px; background: #c5a880; border: none; cursor: pointer; font-weight: 600; width: 100%; color: #000; }
        .inventory-item { display: flex; gap: 15px; align-items: center; padding: 15px; border-bottom: 1px solid #333; }
        #search-bar, #search-pedidos { border: 1px solid #c5a880; }
        
        /* ESTILOS DE LISTA DE PEDIDOS */
        .pedido-card { background: #202020; border: 1px solid rgba(197, 168, 128, 0.3); border-radius: 8px; padding: 20px; margin-bottom: 20px; position: relative; }
        .pedido-header { display: flex; justify-content: space-between; border-bottom: 1px solid #333; padding-bottom: 10px; margin-bottom: 15px; }
        .pedido-prod-item { display: flex; align-items: center; gap: 15px; background: #141414; padding: 10px; border-radius: 6px; margin-bottom: 10px; }
        .pedido-prod-item img { width: 70px; height: 70px; object-fit: contain; background: #000; border-radius: 4px; }
        
        /* BOTÓN X PARA ELIMINAR PEDIDO */
        .btn-delete-pedido {
            color: #888;
            font-size: 16px;
            cursor: pointer;
            transition: color 0.2s ease;
            margin-left: 15px;
        }
        .btn-delete-pedido:hover {
            color: #e74c3c;
        }

        /* ESTILOS DEL ACORDEÓN DE INVENTARIO */
        .brand-accordion {
            margin-bottom: 12px;
            border: 1px solid rgba(197, 168, 128, 0.2);
            border-radius: 6px;
            overflow: hidden;
            background: #141414;
        }

        .brand-accordion-header {
            background: #222;
            padding: 14px 20px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 600;
            color: #c5a880;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 14px;
            transition: background 0.3s;
        }

        .brand-accordion-header:hover {
            background: #2a2a2a;
        }

        .brand-accordion-header i {
            transition: transform 0.3s ease;
            font-size: 12px;
        }

        .brand-accordion-header.active i {
            transform: rotate(180deg);
        }

        .brand-accordion-body {
            display: none;
            background: #181818;
        }

        .brand-accordion-body.active {
            display: block;
        }

        .brand-count-badge {
            background: rgba(197, 168, 128, 0.15);
            color: #ffffff;
            font-size: 11px;
            padding: 3px 8px;
            border-radius: 12px;
            margin-left: 10px;
        }
    </style>
</head>
<body>

<div class="admin-container">
    <img src="rplogo.png" alt="RP Guitar Store" class="logo-admin">
    <h1 id="form-title" style="text-align: center;">Panel de Gestión Total</h1>
    <div class="tabs">
        <button class="tab-btn active" id="btn-subir" onclick="showTab('subir')">Subir Producto</button>
        <button class="tab-btn" id="btn-inventario" onclick="showTab('inventario')">Inventario</button>
        <button class="tab-btn" id="btn-pedidos" onclick="showTab('pedidos')">Pedidos</button>
    </div>

    <div id="subir" class="tab-content active">
        <input type="hidden" id="edit-id">
        <input type="text" id="name" placeholder="Nombre">
        <input type="text" id="price" placeholder="Precio (Q)">
        <input type="number" id="stock" placeholder="Cantidad en stock">
        
        <label>Marca:</label>
        <select id="categoria" onchange="checkOther(this.value)">
            <option value="otra">-- Otra Marca (Escribir manualmente) --</option>
        </select>

        <input type="text" id="nueva-categoria" placeholder="Escribe el nombre de la nueva marca..." style="display: none;">

        <label id="label-grupo" style="display: block; margin-top: 15px; color: #c5a880; font-size: 11px; text-transform: uppercase;">Grupo (¿Dónde clasificar esta marca?):</label>
        <select id="nuevo-grupo" style="width: 100%; padding: 12px 20px; margin-bottom: 20px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 4px; color: white;">
            <option value="Guitarras-Eléctricas">Guitarras Eléctricas</option>
            <option value="Guitarras-Acústicas">Guitarras Acústicas</option>
            <option value="Electro-Acústicas">Electro Acústicas</option>
            <option value="Bajos">Bajos</option>
            <option value="Ukeleles">Ukeleles</option>
            <option value="Amplificadores">Amplificadores</option>
            <option value="Pedales">Pedales</option>
            <option value="Accesorios">Accesorios</option>
            <option value="Lauten-Audio">Micrófonos</option>
        </select>
        
        <textarea id="desc" rows="3" placeholder="Descripción"></textarea>
        <input type="file" id="fileInput" multiple>
        <button id="save-btn">Subir a la Tienda</button>
        <button id="cancel-edit" style="display:none; background:#800; margin-top:10px; color:white;">Cancelar Edición</button>
    </div>

    <div id="inventario" class="tab-content">
        <input type="text" id="search-bar" placeholder="Buscar..." onkeyup="filterInventory()">
        <div id="inventory-list"></div>
    </div>

    <div id="pedidos" class="tab-content">
        <input type="text" id="search-pedidos" placeholder="Buscar por cliente, código (#ABC123) o fecha..." onkeyup="filterPedidos()">
        <div id="pedidos-list">Cargando pedidos...</div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
    import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js";
    import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-storage.js";

    const firebaseConfig = { apiKey: "AIzaSyC7W3ekV5oP1rX6kdJoZQJGry3w2XlhDHA", authDomain: "rpguitarstore-fa879.firebaseapp.com", projectId: "rpguitarstore-fa879", storageBucket: "rpguitarstore-fa879.firebasestorage.app", messagingSenderId: "580505435322", appId: "1:580505435322:web:122d4c01344606c1fe5683" };
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const storage = getStorage(app);

    async function cargarCategoriasAdmin() {
        const select = document.getElementById('categoria');
        const snapshot = await getDocs(collection(db, "productos"));
        const categorias = new Set();
        
        snapshot.forEach(doc => { 
            if(doc.data().categoria) categorias.add(doc.data().categoria); 
        });

        select.innerHTML = '';

        const optionDefault = document.createElement('option');
        optionDefault.value = "";
        optionDefault.text = "Selecciona una opción";
        optionDefault.disabled = true;
        optionDefault.selected = true;
        select.add(optionDefault);

        categorias.forEach(cat => {
            const option = document.createElement('option');
            option.value = cat;
            option.text = cat.charAt(0).toUpperCase() + cat.slice(1).replace(/-/g, ' ');
            select.add(option);
        });

        const optionOtra = document.createElement('option');
        optionOtra.value = "otra";
        optionOtra.text = "Otra marca *Ingresar manualmente*";
        select.add(optionOtra);
    }
    cargarCategoriasAdmin();

    window.showTab = (tabId) => {
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(tabId).classList.add('active');
        const activeBtn = document.getElementById(`btn-${tabId}`);
        if(activeBtn) activeBtn.classList.add('active');
    };

    window.toggleBrandAccordion = (brandHeader) => {
        brandHeader.classList.toggle('active');
        const body = brandHeader.nextElementSibling;
        if (body) {
            body.classList.toggle('active');
        }
    };

    window.filterInventory = () => {
        const val = document.getElementById('search-bar').value.toLowerCase().trim();
        const accordions = document.querySelectorAll('.brand-accordion');

        accordions.forEach(acc => {
            const items = acc.querySelectorAll('.inventory-item');
            let hasMatch = false;

            items.forEach(item => {
                const text = item.innerText.toLowerCase();
                if (text.includes(val)) {
                    item.style.display = 'flex';
                    hasMatch = true;
                } else {
                    item.style.display = 'none';
                }
            });

            const header = acc.querySelector('.brand-accordion-header');
            const body = acc.querySelector('.brand-accordion-body');

            if (val.length > 0) {
                if (hasMatch) {
                    acc.style.display = 'block';
                    header.classList.add('active');
                    body.classList.add('active');
                } else {
                    acc.style.display = 'none';
                }
            } else {
                acc.style.display = 'block';
                header.classList.remove('active');
                body.classList.remove('active');
            }
        });
    };

    async function cargarInventarioAcordeon() {
        const list = document.getElementById('inventory-list');
        list.innerHTML = `<p style="text-align:center; color:#888;">Cargando inventario...</p>`;

        const snapshot = await getDocs(collection(db, "productos"));
        if (snapshot.empty) {
            list.innerHTML = `<p style="text-align:center; color:#888;">No hay productos registrados.</p>`;
            return;
        }

        const productosPorMarca = new Map();

        snapshot.forEach(docSnap => {
            const data = docSnap.data();
            const marca = (data.categoria || 'General').toLowerCase().replace(/-/g, ' ');
            
            if (!productosPorMarca.has(marca)) {
                productosPorMarca.set(marca, []);
            }
            productosPorMarca.get(marca).push({ id: docSnap.id, ...data });
        });

        const marcasOrdenadas = Array.from(productosPorMarca.keys()).sort();
        list.innerHTML = '';

        marcasOrdenadas.forEach(marcaKey => {
            const prods = productosPorMarca.get(marcaKey);
            const nombreMarcaNombre = marcaKey.toUpperCase();

            const accordionDiv = document.createElement('div');
            accordionDiv.className = 'brand-accordion';

            accordionDiv.innerHTML = `
                <div class="brand-accordion-header" onclick="toggleBrandAccordion(this)">
                    <span>
                        <i class="fas fa-layer-group" style="margin-right: 8px;"></i>
                        ${nombreMarcaNombre}
                        <span class="brand-count-badge">${prods.length} ${prods.length === 1 ? 'producto' : 'productos'}</span>
                    </span>
                    <i class="fas fa-chevron-down"></i>
                </div>
                <div class="brand-accordion-body"></div>
            `;

            const bodyDiv = accordionDiv.querySelector('.brand-accordion-body');

            prods.forEach(data => {
                const itemDiv = document.createElement('div');
                itemDiv.className = 'inventory-item';
                itemDiv.innerHTML = `
                    <img src="${data.image || (data.images ? data.images[0] : '')}" style="width: 70px; height: 70px; object-fit: contain; background: #000; border-radius: 4px;">
                    <div style="flex-grow: 1;">
                        <div style="display: flex; justify-content: space-between;">
                            <strong style="color: #fff; font-size: 14px;">${data.name}</strong>
                            <div>
                                <i class="fas fa-pencil-alt" id="edit-${data.id}" style="cursor: pointer; color: #c5a880; margin-right: 15px;" title="Editar"></i>
                                <i class="fas fa-times" id="del-${data.id}" style="cursor: pointer; color: #800;" title="Eliminar"></i>
                            </div>
                        </div>
                        <div style="font-size: 0.85em; color: #aaa; margin-top: 5px;">
                            Grupo: <span style="color:#c5a880;">${data.grupo || 'N/A'}</span> | Stock: <strong>${data.stock || 0}</strong> | Q${data.price}
                        </div>
                    </div>`;

                bodyDiv.appendChild(itemDiv);

                itemDiv.querySelector(`#edit-${data.id}`).onclick = () => {
                    document.getElementById('edit-id').value = data.id;
                    document.getElementById('name').value = data.name;
                    document.getElementById('price').value = data.price;
                    document.getElementById('stock').value = data.stock || 0;
                    document.getElementById('categoria').value = data.categoria;
                    document.getElementById('desc').value = data.desc || '';
                    document.getElementById('save-btn').innerText = "Actualizar Producto";
                    document.getElementById('cancel-edit').style.display = "block";
                    window.showTab('subir');

                    if (data.grupo) {
                        document.getElementById('nuevo-grupo').value = data.grupo;
                    }
                };

                itemDiv.querySelector(`#del-${data.id}`).onclick = async () => {
                    const res = await Swal.fire({
                        title: '¿Eliminar producto?',
                        text: "Esta acción no se puede deshacer.",
                        icon: 'warning',
                        showCancelButton: true,
                        confirmButtonColor: '#800'
                    });
                    if (res.isConfirmed) {
                        await deleteDoc(doc(db, 'productos', data.id));
                        cargarInventarioAcordeon();
                        Swal.fire({ icon: 'success', title: 'Producto eliminado', toast: true, position: 'top-end', showConfirmButton: false, timer: 2000 });
                    }
                };
            });

            list.appendChild(accordionDiv);
        });
    }

    cargarInventarioAcordeon();

    window.filterPedidos = () => {
        const val = document.getElementById('search-pedidos').value.toLowerCase();
        document.querySelectorAll('.pedido-card').forEach(card => {
            card.style.display = card.innerText.toLowerCase().includes(val) ? 'block' : 'none';
        });
    };

    window.checkOther = (val) => {
        const inputMarca = document.getElementById('nueva-categoria');
        inputMarca.style.display = (val === 'otra') ? 'block' : 'none';
    };

    document.getElementById('save-btn').onclick = async () => {
        const id = document.getElementById('edit-id').value;
        const name = document.getElementById('name').value;
        const price = document.getElementById('price').value;
        const stock = document.getElementById('stock').value;
        const desc = document.getElementById('desc').value;
        
        const select = document.getElementById('categoria');
        const inputManual = document.getElementById('nueva-categoria');
        const grupoSelector = document.getElementById('nuevo-grupo');
        
        const categoria = (select.value === 'otra') ? inputManual.value.toLowerCase().replace(/\s+/g, '-') : select.value;
        const grupo = grupoSelector.value;
        const files = Array.from(document.getElementById('fileInput').files);

        if (id) {
            Swal.fire({ title: 'Actualizando...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
            
            let datosActualizados = { name, price, stock, categoria, grupo, desc };

            if (files.length > 0) {
                let nuevasFotos = [];
                for (const file of files) {
                    const storageRef = ref(storage, 'productos/' + Date.now() + '_' + file.name);
                    await uploadBytes(storageRef, file);
                    const url = await getDownloadURL(storageRef);
                    nuevasFotos.push(url);
                }
                datosActualizados.images = nuevasFotos;
                datosActualizados.image = nuevasFotos[0];
            }

            await updateDoc(doc(db, "productos", id), datosActualizados);
            Swal.fire({ icon: 'success', title: 'Producto actualizado', toast: true, position: 'top-end', showConfirmButton: false, timer: 2000 });
        } else {
            if (files.length === 0) return Swal.fire("Error", "Elige al menos una imagen", "error");
            
            Swal.fire({ title: 'Subiendo...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
            
            let listaFotos = [];
            for (const file of files) {
                const storageRef = ref(storage, 'productos/' + Date.now() + '_' + file.name);
                await uploadBytes(storageRef, file);
                const url = await getDownloadURL(storageRef);
                listaFotos.push(url);
            }

            await addDoc(collection(db, "productos"), { 
                name, price, stock, categoria, grupo, desc, 
                image: listaFotos[0],
                images: listaFotos,
                timestamp: Date.now() 
            });
            
            Swal.fire({ icon: 'success', title: 'Producto subido', toast: true, position: 'top-end', showConfirmButton: false, timer: 2000 });
        }
        location.reload();
    };

    async function cargarPedidos() {
        const container = document.getElementById('pedidos-list');
        const snap = await getDocs(collection(db, "pedidos"));
        
        if (snap.empty) {
            container.innerHTML = `<p style="text-align:center; color:#888;">No hay pedidos registrados.</p>`;
            return;
        }

        const listaPedidos = snap.docs.map(d => ({ id: d.id, ...d.data() }))
            .sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));

        let html = '';
        listaPedidos.forEach(ped => {
            const codigoCorto = ped.id.substring(0, 6).toUpperCase();
            const cliente = ped.cliente || { nombre: 'Cliente no especificado' };

            html += `
                <div class="pedido-card" id="card-${ped.id}">
                    <div class="pedido-header" style="display:flex; justify-content:space-between; border-bottom:1px solid #333; padding-bottom:10px; margin-bottom:15px;">
                        <div>
                            <span style="background:#c5a880; color:#000; padding:2px 8px; font-weight:bold; font-size:12px; border-radius:4px;">#${codigoCorto}</span>
                            <h3 style="margin:8px 0 3px 0; color:#fff; font-size:16px;"><i class="fas fa-user" style="color:#c5a880; margin-right:6px;"></i>${cliente.nombre}</h3>
                            <div style="font-size: 11px; color: #888; margin-top:4px;"><i class="far fa-calendar-alt" style="margin-right:4px;"></i>${ped.fecha || ''}</div>
                        </div>
                        <div style="text-align:right; display:flex; align-items:flex-start;">
                            <span style="font-size:18px; font-weight:bold; color:#c5a880;">TOTAL: Q${parseFloat(ped.total).toLocaleString('en-US', {minimumFractionDigits:2})}</span>
                            <i class="fas fa-times btn-delete-pedido" id="del-ped-${ped.id}" title="Eliminar pedido"></i>
                        </div>
                    </div>
                    <div class="pedido-items">
                        ${ped.items.map(item => `
                            <div class="pedido-prod-item" style="display:flex; align-items:center; gap:15px; background:#141414; padding:10px; border-radius:6px; margin-bottom:10px;">
                                <img src="${item.image}" alt="${item.name}" style="width:70px; height:70px; object-fit:contain; background:#000; border-radius:4px;">
                                <div style="flex:1;">
                                    <div style="font-weight:600; font-size:14px; color:#fff;">${item.name}</div>
                                    <div style="font-size:12px; color:#aaa;">Cantidad: ${item.qty} | Subtotal: Q${parseFloat(item.subtotal).toLocaleString('en-US', {minimumFractionDigits:2})}</div>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        });
        container.innerHTML = html;

        listaPedidos.forEach(ped => {
            const btnDelete = document.getElementById(`del-ped-${ped.id}`);
            if (btnDelete) {
                btnDelete.onclick = async () => {
                    const res = await Swal.fire({
                        title: '¿Eliminar este pedido?',
                        text: "Se borrará permanentemente de la bitácora.",
                        icon: 'warning',
                        showCancelButton: true,
                        confirmButtonColor: '#800',
                        cancelButtonColor: '#333',
                        confirmButtonText: 'Sí, eliminar',
                        cancelButtonText: 'Cancelar'
                    });

                    if (res.isConfirmed) {
                        await deleteDoc(doc(db, 'pedidos', ped.id));
                        cargarPedidos();
                        Swal.fire({ icon: 'success', title: 'Pedido eliminado', toast: true, position: 'top-end', showConfirmButton: false, timer: 2000 });
                    }
                };
            }
        });
    }

    cargarPedidos();

    window.addEventListener('load', async () => {
        const hash = window.location.hash;
        if (hash && hash.startsWith('#pedido-')) {
            const pedidoId = hash.replace('#pedido-', '');
            window.showTab('pedidos');

            setTimeout(() => {
                const targetCard = document.getElementById(`card-${pedidoId}`);
                if (targetCard) {
                    targetCard.scrollIntoView({ behavior: 'smooth' });
                    targetCard.style.border = '2px solid #c5a880';
                    targetCard.style.boxShadow = '0 0 15px rgba(197, 168, 128, 0.4)';
                }
            }, 800);
        }
    });

    document.getElementById('cancel-edit').onclick = () => { location.reload(); };
</script>
</body>
</html>
